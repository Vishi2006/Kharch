name: Build & Release Android Companion APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/kharch-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias kharch \
            -dname "CN=Kharch, OU=Dev, O=Vishi, L=India, S=India, C=IN" \
            -storepass kharch_store_pass -keypass kharch_store_pass

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        env:
          KHARCH_KEYSTORE_PATH: ../kharch-release.jks
          KHARCH_KEYSTORE_PASS: kharch_store_pass
          KHARCH_KEY_ALIAS: kharch
          KHARCH_KEY_PASS: kharch_store_pass
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KharchCompanion.apk

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: Kharch Companion ${{ steps.vars.outputs.tag }}
          tag_name: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            KharchCompanion.apk
            android/app/build/outputs/apk/release/app-release.apk
          body: |
            ### Kharch Companion ${{ steps.vars.outputs.tag }} (Signed Release Build)
            - **Google Play Protect Safe**: Un-obfuscated release build, signed with v1, v2, and v3 schemes.
            - **Android 13–15 Ready**: 3-step sequential unlock flow for Restricted Settings on Android 13, 14, and 15 (Xiaomi/Vivo/Oppo/Realme & Samsung/Google).
            - **12-Digit UTR Deduplication**: Stable UTR-based idempotency keys with background WorkManager sync.

            > **Note:** If you had an earlier debug build installed, **uninstall the old companion app first** before installing this release APK.
